<svg xmlns="http://www.w3.org/2000/svg" width="100" height="130" viewBox="0 0 100 130">
  <!-- Eddie from the side: standing upright on watch, head turned to the viewer, tail behind. Same palette as logo.svg. -->
  <defs>
    <filter id="outline" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="2.2" result="d"/>
      <feFlood flood-color="#d9a470"/>
      <feComposite in2="d" operator="in"/>
    </filter>
    <g id="f">
      <!-- tail -->
      <path d="M62 118c14-2 22-14 20-30" stroke="#f1cfa3" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M79 92c2-2 4-3 6-2" stroke="#3b2a22" stroke-width="7" stroke-linecap="round" fill="none"/>
      <!-- body, slightly leaning, slim like a meerkat on watch -->
      <path d="M30 126V74c0-18 8-30 20-30s20 12 20 30v52z" fill="#fbe6c8"/>
      <path d="M38 126V80c0-11 5-18 12-18s12 7 12 18v46z" fill="#f7dcb8"/>
      <!-- folded paws in front -->
      <path d="M36 92q14-7 28 0" stroke="#f1cfa3" stroke-width="8" stroke-linecap="round" fill="none"/>
      <g fill="#c98f5c"><circle cx="40" cy="90" r="1.6"/><circle cx="44" cy="89" r="1.6"/><circle cx="56" cy="89" r="1.6"/><circle cx="60" cy="90" r="1.6"/></g>
      <!-- feet -->
      <ellipse cx="38" cy="126" rx="10" ry="4" fill="#f1cfa3"/><ellipse cx="60" cy="126" rx="10" ry="4" fill="#f1cfa3"/>
      <!-- head, three-quarter view -->
      <circle cx="50" cy="40" r="26" fill="#fbe6c8"/>
      <circle cx="26" cy="36" r="6.5" fill="#f1cfa3"/><circle cx="74" cy="36" r="6.5" fill="#f1cfa3"/>
      <ellipse cx="39" cy="39" rx="7.5" ry="9" fill="#3b2a22"/><ellipse cx="61" cy="39" rx="7.5" ry="9" fill="#3b2a22"/>
      <circle cx="40.5" cy="37.5" r="3.4" fill="#fff"/><circle cx="62.5" cy="37.5" r="3.4" fill="#fff"/>
      <circle cx="41.5" cy="38.5" r="1.6" fill="#1c1c28"/><circle cx="63.5" cy="38.5" r="1.6" fill="#1c1c28"/>
      <ellipse cx="50" cy="52" rx="9" ry="6.5" fill="#f1cfa3"/><ellipse cx="50" cy="50" rx="3.8" ry="2.8" fill="#3b2a22"/>
      <path d="M45 56.5q5 3.5 10 0" stroke="#3b2a22" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    </g>
  </defs>
  <use href="#f" filter="url(#outline)"/>
  <use href="#f"/>
</svg>
